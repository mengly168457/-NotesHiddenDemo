workflows:
  ios-demo:
    name: Notes Hidden Demo
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract Xcode project
        script: |
          rm -rf "$CM_BUILD_DIR/project"
          mkdir -p "$CM_BUILD_DIR/project"
          unzip -q "$CM_BUILD_DIR/NotesHiddenDemo_XcodeProject.zip" -d "$CM_BUILD_DIR/project"

      - name: Build unsigned app
        script: |
          cd "$CM_BUILD_DIR/project/NotesHiddenDemoXcode"

          rm -rf "$CM_BUILD_DIR/DerivedData"

          xcodebuild             -project "NotesHiddenDemo.xcodeproj"             -scheme "NotesHiddenDemo"             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath "$CM_BUILD_DIR/DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             PRODUCT_NAME=NotesHiddenDemo

      - name: Create IPA
        script: |
          APP_PATH="$(find "$CM_BUILD_DIR/DerivedData" -type d -path "*/Build/Products/Release-iphoneos/NotesHiddenDemo.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "NotesHiddenDemo.app was not found."
            find "$CM_BUILD_DIR/DerivedData" -type d -name "*.app" -print
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ipa/Payload/NotesHiddenDemo.app"

          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry "NotesHiddenDemo.ipa" "Payload"

    artifacts:
      - build/ipa/NotesHiddenDemo.ipa
