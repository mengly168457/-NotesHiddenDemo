workflows:
  ios-demo:
    name: Notes Hidden Demo
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract Xcode project
        script: |
          rm -rf "$CM_BUILD_DIR/project"
          mkdir -p "$CM_BUILD_DIR/project"
          unzip -q "$CM_BUILD_DIR/NotesHiddenDemo_XcodeProject.zip" -d "$CM_BUILD_DIR/project"

      - name: Build unsigned app
        script: |
          cd "$CM_BUILD_DIR/project/NotesHiddenDemoXcode"

          xcodebuild \
            -project "NotesHiddenDemo.xcodeproj" \
            -scheme "NotesHiddenDemo" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build"

      - name: Create IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$CM_BUILD_DIR/build/NotesHiddenDemo.app" \
            "$CM_BUILD_DIR/build/ipa/Payload/"

          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry "NotesHiddenDemo.ipa" "Payload"

    artifacts:
      - build/ipa/NotesHiddenDemo.ipa
